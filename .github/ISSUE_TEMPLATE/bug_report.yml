name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Runwright 0.1.0 · gitlab-runner 19.5.2 · macOS 15.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: From the Log page. Remove any tokens first.
      render: text
